name: "CI - Testy i Walidacja Skryptow"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: "Weryfikacja składni i testy automatyczne"
    runs-on: ubuntu-latest

    steps:
      - name: "Pobranie kodu repozytorium"
        uses: actions/checkout@v4

      - name: "Konfiguracja srodowiska Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Nadanie uprawnien wykonywalnych skryptom"
        run: |
          chmod +x scripts/*.sh scripts/*.py zarzadzaj.sh automatyzacja_testow.sh

      - name: "Weryfikacja skladni skryptow Basha"
        run: |
          echo "Sprawdzanie składni skryptów powłoki..."
          for file in scripts/*.sh zarzadzaj.sh automatyzacja_testow.sh; do
            echo "Testowanie: $file"
            bash -n "$file"
          done

      - name: "Weryfikacja skladni skryptow Pythona"
        run: |
          echo "Kompilacja i sprawdzanie składni Pythona..."
          for file in scripts/*.py; do
            echo "Testowanie: $file"
            python3 -m py_compile "$file"
          done

      - name: "Test uruchomieniowy - Narzedzie 01 (JSON)"
        run: |
          ./scripts/01_system_health_reporter.sh --json

      - name: "Test uruchomieniowy - Narzedzie 02 (Symulacja dry-run)"
        run: |
          ./scripts/02_backup_rotator.sh -s scripts -d /tmp/kopie_ci --dry-run

      - name: "Test uruchomieniowy - Narzedzie 06 (SSL)"
        run: |
          python3 ./scripts/06_ssl_domain_inspector.py github.com google.com --json
